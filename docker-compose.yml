services:
  postgres:
    # Matches production. pg_dump refuses to read a newer server, and a dump cannot be
    # restored into an older major version, so local has to track production to be loadable.
    image: postgres:18
    container_name: masquare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: masquare
      POSTGRES_PASSWORD: masquare
      POSTGRES_DB: masquare
    ports:
      - "5434:5432"
    volumes:
      # 18+ stores data in a major-version subdirectory (/var/lib/postgresql/18/docker) so that
      # pg_upgrade --link can work without crossing a mount boundary. Mounting at .../data instead
      # makes the image refuse to start.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masquare -d masquare"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    container_name: masquare-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: masquare
      MINIO_ROOT_PASSWORD: masquare123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the media bucket so the app boots clean.
  minio-setup:
    image: minio/mc
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 masquare masquare123) do echo 'waiting for minio'; sleep 1; done;
      mc mb --ignore-existing local/masquare-media;
      mc anonymous set download local/masquare-media;
      echo 'bucket ready';
      "

volumes:
  pgdata: {}
  miniodata: {}
