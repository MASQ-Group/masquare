services:
  postgres:
    image: postgres:16
    container_name: masquare-postgres
    environment:
      POSTGRES_USER: masquare
      POSTGRES_PASSWORD: masquare
      POSTGRES_DB: masquare
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masquare -d masquare"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    container_name: masquare-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: masquare
      MINIO_ROOT_PASSWORD: masquare123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the media bucket so the app boots clean.
  minio-setup:
    image: minio/mc
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 masquare masquare123) do echo 'waiting for minio'; sleep 1; done;
      mc mb --ignore-existing local/masquare-media;
      mc anonymous set download local/masquare-media;
      echo 'bucket ready';
      "

volumes:
  pgdata: {}
  miniodata: {}
